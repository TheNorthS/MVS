[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mcp-virtual-shell"
version = "0.0.1"
description = "A bounded virtual command gateway for MCP tools"
readme = {file = "docs/PYPI.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "TheNorthS"}]
keywords = ["mcp", "agent", "tools", "gateway", "virtual-shell"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12"
dependencies = ["mcp>=2,<3", "jsonschema>=4.23,<5", "pyyaml>=6,<7", "cryptography>=44", "pywin32>=312; sys_platform == 'win32'"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "opentelemetry-sdk>=1.45", "prometheus-client>=0.21"]
benchmark = ["httpx>=0.28"]
console = ["fastapi>=0.115", "opentelemetry-sdk>=1.45", "prometheus-client>=0.21", "httpx>=0.28", "uvicorn>=0.30"]
production = ["redis>=5", "psycopg[binary]>=3", "boto3>=1.35", "keyring>=25"]

[project.scripts]
mvs = "mvs.cli:main"
mvs-benchmark = "mvs.benchmarks.runner:main"
mvs-agent = "mvs.agent:main"

[project.urls]
Homepage = "https://github.com/TheNorthS/MVS"
Repository = "https://github.com/TheNorthS/MVS"
Documentation = "https://github.com/TheNorthS/MVS/blob/main/docs/README.md"
Issues = "https://github.com/TheNorthS/MVS/issues"
Changelog = "https://github.com/TheNorthS/MVS/blob/main/docs/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "pytest-cov>=6", "ruff>=0.11", "mypy>=1.15", "types-PyYAML", "types-jsonschema", "httpx>=0.28", "fastapi>=0.115", "opentelemetry-sdk>=1.45", "prometheus-client>=0.21"]

[tool.hatch.build]
# 前端生成物不提交Git，但正式wheel必须包含已构建的静态页面。
artifacts = ["src/mvs/web/**"]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo", "**/*.tsbuildinfo", "**/node_modules"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mvs"]

[tool.hatch.build.targets.sdist]
# 只选择可重建源码包所需的目录，避免收进凭证、实验缓存和旧安装包。
only-include = [
    "src/mvs", "web", "scripts", "tests", "configs", "examples",
    "pyproject.toml", "uv.lock", "hatch_build.py", "README.md", "docs/PYPI.md",
    "LICENSE", "NOTICE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
exclude = [".tools", ".venv"]

[tool.mypy]
python_version = "3.12"
files = ["src/mvs"]
check_untyped_defs = true
disallow_untyped_defs = true
