name: release
on:
  workflow_dispatch:
    inputs:
      destination:
        description: 构建后是否发布到包索引
        type: choice
        options: [build-only, testpypi, pypi]
        default: build-only
      github_draft:
        description: 同时创建GitHub草稿Release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-0.0.1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked --all-extras
      - run: uv run python scripts/check_repository.py
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest tests/unit/test_distribution.py tests/unit/test_release_bundle.py tests/unit/test_release_operations.py -q
      - run: uv run python scripts/build_release.py
      - run: uvx twine check --strict dist/release/0.0.1/pypi/*
      - uses: actions/upload-artifact@v4
        with:
          name: mvs-0.0.1-release
          path: dist/release/0.0.1/
          if-no-files-found: error

  github-draft:
    needs: build
    if: inputs.github_draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mvs-0.0.1-release
          path: release
      - name: 创建草稿Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: >-
          gh release create v0.0.1 release/pypi/* release/installers/*.zip
          release/SHA256SUMS.json --draft --target "$SOURCE_SHA"
          --title "MVS 0.0.1" --generate-notes

  testpypi:
    needs: build
    if: inputs.destination == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mvs-0.0.1-release
          path: release
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release/pypi/
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: inputs.destination == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mvs-0.0.1-release
          path: release
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release/pypi/
