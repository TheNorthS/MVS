name: external-storage-integration
on: [push, pull_request, workflow_dispatch]
jobs:
  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --all-extras
      - run: |
          docker pull redis:7-alpine
          docker pull postgres:16-alpine
          docker pull python:3.12-slim
      - run: docker build -f deploy/minio-test.Dockerfile -t mvs-test-minio:0.0.1 deploy
      - run: uv run python scripts/test_docker.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-acceptance
          path: .tools/docker-acceptance.xml
