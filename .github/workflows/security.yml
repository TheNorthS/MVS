name: dependency-security
on: [push, pull_request, workflow_dispatch]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --all-extras
      - run: uv run --with pip-audit pip-audit --format json --output python-audit.json
      - run: uv run --with pip-licenses pip-licenses --format=json --output-file=python-licenses.json
      - run: uv run python scripts/check_licenses.py python-licenses.json
      - run: npm ci && npm audit --registry=https://registry.npmjs.org --audit-level=high
        working-directory: web
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-reports
          path: '*-*.json'
